server {
    listen 80;
    server_name localhost;

    # Uploads are whole feature tables; the API's own limit is 100 MB.
    # Set at server level so it applies to every location, not just /api/.
    client_max_body_size 200M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend static files (SPA: unknown paths fall through to index.html)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Analyses run synchronously when no Celery worker is available, and a
        # PERMANOVA with 999 permutations over a few hundred samples takes
        # minutes. The previous 60s read timeout turned those into 504s.
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;

        # Stream uploads and results instead of buffering them to disk.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Server-Sent Events for the agent's streaming execution endpoint.
    # Buffering here would hold every progress event until the run finished.
    location /api/v1/agent/execute {
        proxy_pass http://backend:8000/api/v1/agent/execute;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        chunked_transfer_encoding off;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
