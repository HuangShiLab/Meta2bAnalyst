# Meta2bAnalyst - intranet multi-user deployment.
#
# Usage (from the repository root):
#     docker compose -f docker/docker-compose.yml up --build -d
#     open http://localhost:8080
#
# The backend enforces per-user login (app/services/auth.py: login, per-user
# sessions, storage quota, guest mode for shared demo sessions). The first
# admin account is seeded when the users table is empty; without ADMIN_PASSWORD
# its initial password is printed once in the backend log.
# Binding lives in docker/.env: M2B_BIND_ADDR=0.0.0.0 serves the LAN (that
# file also carries AUTH_SECRET so login tokens survive restarts); set it
# back to 127.0.0.1 for single-user local-only access.
# M2B_ACCESS_PASSWORD optionally adds a shared nginx basic-auth gate in front
# of the whole site, on top of the app login.

name: meta2banalyst

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Not published: only the backend and worker need it.
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      # Context is the repo root so the Dockerfile can reach both backend/ and
      # docker/install_r_packages.R.
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: meta2banalyst-backend:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/meta2banalyst.db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      LOG_DIR: /app/logs
      MAX_FILE_SIZE: "104857600"
      # The frontend is served from :8080 and proxies /api itself, so browser
      # requests are same-origin; this list only matters for direct API calls.
      CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      ENVIRONMENT: production
      DEBUG: "false"
      # Auth: AUTH_SECRET keeps login tokens valid across restarts (docker/.env);
      # ADMIN_PASSWORD only seeds the first admin on an empty database.
      AUTH_SECRET: ${AUTH_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # LLM assist (planner fallback + narrative interpretation). Leave
      # KIMI_API_KEY unset to run KB-only; values come from docker/.env
      # (gitignored) or the shell environment.
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.kimi.com/coding/v1}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-for-coding}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
      - db_data:/app/data
      # Demo datasets for the MCP load_demo_dataset tool (read-only).
      - ../sample_data:/app/sample_data:ro
    depends_on:
      redis:
        condition: service_healthy

  # Celery worker. Without it, any analysis large enough to take the async path
  # is queued and never executed. The backend probes for a live worker and falls
  # back to running synchronously, so this service is what actually enables
  # background processing.
  worker:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: meta2banalyst-backend:local
    restart: unless-stopped
    # Consume BOTH queues: task_routes in celery_app.py publishes
    # app.tasks.analysis_tasks.* to the 'analysis' queue, but a worker without
    # -Q only consumes the default 'celery' queue -- so every async analysis
    # job used to pile up unconsumed and stay 'pending' forever.
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2 -Q analysis,celery
    environment:
      DATABASE_URL: sqlite:////app/data/meta2banalyst.db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      LOG_DIR: /app/logs
      ENVIRONMENT: production
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.kimi.com/coding/v1}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-for-coding}
    volumes:
      # Must share uploads and the database with the backend: tasks read the
      # session's files from disk by path.
      - uploads_data:/app/uploads
      - logs_data:/app/logs
      - db_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    # The worker shares the backend image, whose HEALTHCHECK curls :8000 - but
    # celery serves no HTTP, so the worker would report unhealthy forever.
    # Ping the worker over the broker instead.
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    image: meta2banalyst-frontend:local
    restart: unless-stopped
    environment:
      # Shared-password gate for classroom/intranet use (see
      # docker/frontend-entrypoint.sh). Empty = open access; set it here or
      # via `M2B_ACCESS_PASSWORD=... docker compose ... up -d`.
      ACCESS_PASSWORD: ${M2B_ACCESS_PASSWORD:-}
      ACCESS_USER: ${M2B_ACCESS_USER:-student}
    ports:
      # 8080 rather than 80: no root privileges needed, and it does not collide
      # with whatever else the tester runs locally.
      # Bind address is configurable: 127.0.0.1 for single-user local use
      # (default before), 0.0.0.0 to serve the LAN/intranet — only do that
      # together with M2B_ACCESS_PASSWORD, there is no per-user auth.
      - "${M2B_BIND_ADDR:-127.0.0.1}:8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_data:
  uploads_data:
  logs_data:
  db_data:
