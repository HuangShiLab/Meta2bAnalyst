name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
        # rpy2/R, umap-learn, scikit-learn-extra, openai are optional and
        # lazily imported; tests that need them skip when absent.

      - name: Run backend tests
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (oxlint)
        run: npm run lint
        # oxlint exits non-zero only on errors; warnings are tracked in
        # issue backlog (P3) and do not gate merges yet.

      - name: Build
        run: npm run build
